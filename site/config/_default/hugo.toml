######################## default configuration ####################
baseURL = "http://localhost:1313/"
title = "Green Property - Property Manager Professionista per Affitti Brevi"
theme = "bexer-hugo"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone = "Europe/Rome"
# genera /robots.txt da layouts/robots.txt
enableRobotsTXT = true
# post pagination
pagination.pagerSize = 20 # see https://gohugo.io/extras/pagination/
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/excerpts/
# google analytics
googleAnalytics = "UA-123456-78" # example: UA-123456-78, for more info, read the article https://support.google.com/analytics/answer/1008080?hl=en

# multilingua: l'italiano è la lingua di default (servita alla root; l'inglese sotto /en/).
# Le lingue sono definite in languages.toml.
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false
# disable language
disableLanguages = [
  "fr",
] # example: ["fr"] for disable french language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage

# disqus short name
[services]
[services.disqus]
shortname = "Green Property"

############################# Imaging #############################
# Qualità di default per le immagini processate da Hugo (pipeline in assets/)
[imaging]
quality = 80
resampleFilter = "Lanczos"

############################# Build ##############################
[build]
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = '(js|scripts|javascript)'
[[build.cachebusters]]
source = 'assets/.*\.(css|sass|scss)$'
target = '(css|styles|scss|sass)'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'

############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS", "JSON", "WebAppManifest", "LLMS"]

# llms.txt — indice in testo per i motori di ricerca AI (llmstxt.org)
[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
rel = "alternate"
notAlternative = true

############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true

############################ Media types ############################
[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]

############################ Output Format ###########################
[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"
