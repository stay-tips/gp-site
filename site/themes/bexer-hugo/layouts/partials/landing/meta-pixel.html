{{/* Meta Pixel della landing proprietari. L'id sta in params.toml (meta_pixel_id).
     Parametri: lead (true = invia anche l'evento Lead, una sola volta per sessione: serve nella pagina
     di ringraziamento del modulo). */}}
{{ with site.Params.meta_pixel_id }}
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '{{ . }}');
fbq('track', 'PageView');
{{ if $.lead }}
try {
  if (!sessionStorage.getItem('gpLeadInviato')) {
    fbq('track', 'Lead');
    sessionStorage.setItem('gpLeadInviato', '1');
  }
} catch (e) { fbq('track', 'Lead'); }
{{ end }}
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id={{ . }}&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->
{{ end }}
