{{ $tel := site.Params.mobile }}
<footer style="background:#0C3F2B; color:#F3F7F1; padding:36px 24px;">
  <div style="max-width:1180px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px;">
    <a href="{{ site.Home.RelPermalink }}" aria-label="Green Property, pagina principale"><img loading="lazy" src="{{ site.Params.logo_footer | absURL }}" alt="Green Property" style="width:90px; height:auto;"></a>
    <div style="display:flex; flex-wrap:wrap; gap:12px 24px;">
      <a style="color:inherit;" href="{{ printf "tel:%s" (replace $tel " " "") | safeURL }}">{{ $tel }}</a>
      <a style="color:inherit;" href="{{ printf "mailto:%s" site.Params.email | safeURL }}">{{ site.Params.email }}</a>
    </div>
    <nav aria-label="Informazioni legali" style="display:flex; flex-wrap:wrap; gap:16px;">
      {{ range site.Menus.footer }}
      <a style="color:inherit;" href="{{ .URL | relLangURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</footer>
