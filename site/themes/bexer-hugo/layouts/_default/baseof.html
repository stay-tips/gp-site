<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en-US` }}">

<head>
	{{ partial "head.html" . }}
	{{ partialCached "style.html" . }}
</head>

<body>
	{{ partialCached "preloader.html" . }}
	{{ if ne .Layout "landing" }}
		{{ partial "header.html" . }}
	{{ end }}
	<main>
		{{ block "main" . }}{{ end }}
	</main>
	{{ partial "footer.html" . }}
	{{ partialCached "script.html" . }}
</body>

</html>
