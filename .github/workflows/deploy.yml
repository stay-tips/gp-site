name: Deploy to Hetzner

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Un solo deploy di produzione alla volta
concurrency:
  group: deploy-production
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.163.1"
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Node.js dependencies (if present)
        working-directory: ./site
        run: '[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true'

      - name: Build site (production)
        working-directory: ./site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --minify --gc --environment production

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${{ secrets.HETZNER_SSH_PORT }}"
          ssh-keyscan -p "${PORT:-22}" -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          PORT="${{ secrets.HETZNER_SSH_PORT }}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT:-22}" \
            site/public/ \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${{ secrets.HETZNER_DEPLOY_PATH }}/"
